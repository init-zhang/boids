<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Boids</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            canvas {
                display: block;
            }

            #controls {
                position: absolute;
                top: 0;
                left: 0;
            }
        </style>
    </head>
    <body>
        <canvas width="500" height="500" id="canvas"></canvas>
        <script src="./boids.js"></script>
        <div id="controls">
            <details>
                <summary>Controls</summary>
                <div>
                    <input type="range" id="distance" name="distance" min="0" max="400" step="20" />
                    <label for="distance">Distance</label>
                </div>

                <div>
                    <input type="range" id="separationDistance" name="separationDistance" min="0" max="200" step="10" />
                    <label for="separationDistance">Separation Distance</label>
                </div>

                <div>
                    <input type="range" id="separationPower" name="separationPower" min="0" max="1" step="0.1" />
                    <label for="separationPower">Separation Power</label>
                </div>

                <div>
                    <input type="range" id="alignmentPower" name="alignmentPower" min="0" max="1" step="0.1" />
                    <label for="alignmentPower">Alignment Power</label>
                </div>

                <div>
                    <input type="range" id="cohesionPower" name="cohesionPower" min="0" max="1" step="0.1" />
                    <label for="cohesionPower">Cohesion Power</label>
                </div>

                <div>
                    <input type="range" id="maxVelocity" name="maxVelocity" min="1" max="10" step="1" />
                    <label for="maxVelocity">Max Velocity</label>
                </div>

                <div>
                    <input type="range" id="maxAcceleration" name="maxAcceleration" min="0.1" max="2" step="0.1" />
                    <label for="maxAcceleration">Max Acceleration</label>
                </div>

                <div>
                    <input type="range" id="lineMultiplier" name="lineMultiplier" min="0" max="20" step="1" />
                    <label for="lineMultiplier">Line Multiplier</label>
                </div>

                <div>
                    <input type="range" id="trail" name="trail" min="0.1" max="1" step="0.1" />
                    <label for="trail">Trail</label>
                </div>

            </details>
        </div>
    </body>
</html>
